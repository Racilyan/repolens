[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "Understand any codebase in seconds: summarize a repo, generate a README, explain a file. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Racilyan" }]
keywords = ["ai", "cli", "llm", "readme", "documentation", "developer-tools", "claude", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Racilyan/repolens"
Issues = "https://github.com/Racilyan/repolens/issues"

[project.scripts]
repolens = "repolens.cli:main"

[tool.setuptools]
packages = ["repolens"]
